[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [
  { name="Hugo Silva de Almeida", email="hsilva-d@student.42sp.org.br" },
  { name="Gabriel Oliveira dos Santos", email="gabrielo@student.42sp.org.br" }
]
description = "A standalone, reusable maze generator and solver."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]
